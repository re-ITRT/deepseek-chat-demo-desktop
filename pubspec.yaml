name: deepseek_chat_demo
description: "DeepSeek Chat Demo —— 基于 DeepSeek API 的聊天示例，用 Flutter WebView 封装为原生 Android / Linux 应用。"
# Publishing is done by pushing to GitHub; keep pub.dev publishing off.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Android / iOS 原生 WebView
  webview_flutter: ^4.10.0
  # Linux 桌面 WebKitGTK WebView
  desktop_webview_window: ^0.4.3
  # 本地静态资源服务器
  shelf: ^1.4.1
  shelf_static: ^1.1.3
  path: ^1.9.0
  # 跨平台定位应用缓存/数据目录
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - web/dist/
    - web/dist/static/
    - web/dist/static/js/
    - web/dist/static/js/async/
    - web/dist/static/css/
    - web/dist/static/css/async/
    - web/dist/static/media/